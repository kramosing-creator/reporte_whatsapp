<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Inspección</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f4f7;
            color: #222;
        }

        .contenedor {
            max-width: 850px;
            margin: 0 auto;
            padding: 20px;
        }

        .encabezado {
            background: #1f2937;
            color: white;
            padding: 22px;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }

        .encabezado h1 {
            margin: 0;
            font-size: 25px;
        }

        .encabezado p {
            margin: 8px 0 0;
            font-size: 14px;
        }

        .formulario {
            background: white;
            padding: 25px;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .grupo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 16px;
            background: white;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .fecha {
            background: #e5e7eb;
        }

        .tipos-reporte {
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 12px;
            background: #f8fafc;
        }

        .opcion-reporte {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 4px;
            cursor: pointer;
            font-weight: normal;
            margin: 0;
        }

        .opcion-reporte input {
            width: 20px;
            height: 20px;
            margin: 0;
            cursor: pointer;
        }

        .ayuda {
            font-size: 13px;
            color: #666;
            margin-top: 7px;
        }

        .nombre-otro {
            display: none;
            margin-top: 10px;
        }

        .botones {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 13px 18px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .generar {
            background: #2563eb;
            color: white;
            flex: 1;
        }

        .limpiar {
            background: #e5e7eb;
            color: #222;
        }

        .whatsapp {
            background: #25D366;
            color: white;
            width: 100%;
            margin-top: 12px;
        }

        .resultado {
            display: none;
            margin-top: 25px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .resultado h2 {
            margin-top: 0;
        }

        .reporte {
            background: #f8fafc;
            border: 1px solid #dbe2ea;
            border-radius: 8px;
            padding: 18px;
            white-space: pre-wrap;
            line-height: 1.35;
            font-size: 15px;
        }

        .fotos-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .foto {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        .nota {
            font-size: 13px;
            color: #666;
            margin-top: 6px;
        }

        @media (max-width: 600px) {

            .contenedor {
                padding: 10px;
            }

            .formulario,
            .resultado {
                padding: 17px;
            }

            .encabezado h1 {
                font-size: 21px;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="contenedor">

    <div class="encabezado">
        <h1>REPORTE DE INSPECCIÓN</h1>
        <p>Formulario estandarizado de inspección</p>
    </div>

    <div class="formulario">

        <div class="grupo">
            <label for="fecha">Fecha del reporte</label>
            <input type="text" id="fecha" class="fecha" readonly>
        </div>

        <div class="grupo">
            <label for="ubicacion">Ubicación</label>
            <input type="text" id="ubicacion" placeholder="Escriba la ubicación">
        </div>

        <div class="grupo">
            <label for="contratista">Contratista</label>
            <input type="text" id="contratista" placeholder="Escriba el contratista">
        </div>

        <div class="grupo">
            <label for="tipoReportePrincipal">Tipo de reporte</label>
            <select id="tipoReportePrincipal" onchange="cambiarTipoReporte()">
                <option value="">Seleccione el tipo de reporte</option>
                <option value="SST">SST</option>
                <option value="AMBIENTAL">AMBIENTAL</option>
                <option value="MEV">MEV</option>
                <option value="PESV">PESV</option>
            </select>
        </div>

        <div class="grupo" id="grupoTipoMovil" style="display:none;">
            <label for="tipoMovil">Tipo de móvil</label>
            <input type="text" id="tipoMovil" placeholder="Escriba el tipo de móvil">
        </div>

        <div class="grupo" id="grupoPlaca" style="display:none;">
            <label for="placa">Número de móvil o placa</label>
            <input type="text" id="placa" placeholder="Escriba el número de móvil o placa">
        </div>

        <div class="grupo" id="grupoHallazgos" style="display:none;">
            <label>Tipo de hallazgo</label>
            <div class="tipos-reporte">
                <label class="opcion-reporte"><input type="checkbox" name="tipoHallazgo" value="HIDRÁULICO"> HIDRÁULICO</label>
                <label class="opcion-reporte"><input type="checkbox" name="tipoHallazgo" value="MECÁNICO"> MECÁNICO</label>
                <label class="opcion-reporte"><input type="checkbox" name="tipoHallazgo" value="ELÉCTRICO"> ELÉCTRICO</label>
                <label class="opcion-reporte"><input type="checkbox" name="tipoHallazgo" value="CHASIS"> CHASIS</label>
                <label class="opcion-reporte"><input type="checkbox" name="tipoHallazgo" value="ESTRUCTURAL"> ESTRUCTURAL</label>
                <label class="opcion-reporte"><input type="checkbox" name="tipoHallazgo" value="NEUMÁTICO"> NEUMÁTICO</label>
                <label class="opcion-reporte"><input type="checkbox" name="tipoHallazgo" value="MOTOR"> MOTOR</label>
                <label class="opcion-reporte"><input type="checkbox" name="tipoHallazgo" value="TRANSMISIÓN"> TRANSMISIÓN</label>
                <label class="opcion-reporte"><input type="checkbox" name="tipoHallazgo" value="FRENOS"> FRENOS</label>
                <label class="opcion-reporte"><input type="checkbox" name="tipoHallazgo" value="SEGURIDAD"> SEGURIDAD</label>
                <label class="opcion-reporte"><input type="checkbox" name="tipoHallazgo" value="DOCUMENTACIÓN"> DOCUMENTACIÓN</label>
                <label class="opcion-reporte"><input type="checkbox" name="tipoHallazgo" value="NO CUMPLE"> NO CUMPLE</label>
                <label class="opcion-reporte"><input type="checkbox" name="tipoHallazgo" value="RETIRADO"> RETIRADO</label>
            </div>
            <div class="ayuda">Puede seleccionar uno o varios tipos de hallazgo.</div>
        </div>

        <div class="grupo">
            <label for="observaciones">Observaciones</label>
            <textarea id="observaciones" placeholder="Escriba aquí todas las observaciones necesarias"></textarea>
        </div>

        <div class="grupo">
            <label for="fotos">Registro fotográfico</label>
            <input type="file" id="fotos" accept="image/*" multiple>
            <div class="nota">Puede seleccionar una o varias fotografías.</div>
            <div id="fotosPreview" class="fotos-preview"></div>
        </div>

        <div class="grupo">
            <label for="inspector">Inspector</label>
            <select id="inspector">
                <option value="">Seleccione el inspector</option>
                <option value="ANDRES SANTANILLA">ANDRES SANTANILLA</option>
                <option value="ANGELA RUIZ">ANGELA RUIZ</option>
                <option value="ANGIE NATALIA MONROY">ANGIE NATALIA MONROY</option>
                <option value="CARLOS RAMOS">CARLOS RAMOS</option>
                <option value="CINDY PAOLA ARCHILA">CINDY PAOLA ARCHILA</option>
                <option value="CRISTIAN MORATO">CRISTIAN MORATO</option>
                <option value="DANIEL GUEVARA">DANIEL GUEVARA</option>
                <option value="DANIEL SILVA">DANIEL SILVA</option>
                <option value="DIEGO MEDINA">DIEGO MEDINA</option>
                <option value="EDIS BASTIDAS">EDIS BASTIDAS</option>
                <option value="EDGAR PEÑUELA">EDGAR PEÑUELA</option>
                <option value="GERALDINE HURTADO">GERALDINE HURTADO</option>
                <option value="GIOVANNI DIAZ">GIOVANNI DIAZ</option>
                <option value="GILBERTO BARRERO CHAVEZ">GILBERTO BARRERO CHAVEZ</option>
                <option value="JOHN GARZON">JOHN GARZON</option>
                <option value="JOHN GONZALES">JOHN GONZALES</option>
                <option value="JOHN HERNANDEZ">JOHN HERNANDEZ</option>
                <option value="JORGE HERNANDEZ">JORGE HERNANDEZ</option>
                <option value="JULIAN JARAMILLO">JULIAN JARAMILLO</option>
                <option value="KATHERINE GOMEZ">KATHERINE GOMEZ</option>
                <option value="KAROL MOSQUERA">KAROL MOSQUERA</option>
                <option value="MARIA ALEXANDRA PALACIOS">MARIA ALEXANDRA PALACIOS</option>
                <option value="MARIA CAMILA CORREA">MARIA CAMILA CORREA</option>
                <option value="MATEO DAZA">MATEO DAZA</option>
                <option value="MIGUEL MARIN">MIGUEL MARIN</option>
                <option value="OSCAR TOVAR">OSCAR TOVAR</option>
                <option value="RONALD BASTIDAS">RONALD BASTIDAS</option>
                <option value="WIILIAM CALDERON">WIILIAM CALDERON</option>
            </select>
        </div>

        <div class="botones">

            <button
                class="generar"
                onclick="generarReporte()">

                GENERAR REPORTE

            </button>

            <button
                class="limpiar"
                onclick="limpiarFormulario()">

                LIMPIAR

            </button>

        </div>

    </div>


    <div
        id="resultado"
        class="resultado">

        <h2>REPORTE GENERADO</h2>

        <div
            id="textoReporte"
            class="reporte">
        </div>

        <button
            class="whatsapp"
            onclick="compartirWhatsApp()">

            COMPARTIR POR WHATSAPP

        </button>

    </div>

</div>


<script>

    let archivosFotos = [];

    const URL_GOOGLE_SHEETS =
        "https://script.google.com/macros/s/AKfycbxm0E5HPNo-iLVdOAzjFTdOLrf6P08CPMSmf4hE_i_9LW5qQJxpIWmnGSarXk_ds4ou/exec";


    // FECHA AUTOMÁTICA
    function actualizarFecha() {

        const ahora = new Date();

        const opciones = {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        };

        document.getElementById("fecha").value =
            ahora.toLocaleString("es-CO", opciones);

    }

    actualizarFecha();


    // MOSTRAR LOS CAMPOS SEGÚN EL TIPO DE REPORTE
    function cambiarTipoReporte() {
        const tipo = document.getElementById("tipoReportePrincipal").value;
        const grupoTipoMovil = document.getElementById("grupoTipoMovil");
        const grupoPlaca = document.getElementById("grupoPlaca");
        const grupoHallazgos = document.getElementById("grupoHallazgos");

        grupoTipoMovil.style.display = (tipo === "MEV" || tipo === "PESV") ? "block" : "none";
        grupoPlaca.style.display = (tipo === "MEV" || tipo === "PESV") ? "block" : "none";
        grupoHallazgos.style.display = tipo === "MEV" ? "block" : "none";

        if (tipo !== "MEV") {
            document.querySelectorAll('input[name="tipoHallazgo"]').forEach(c => c.checked = false);
        }
        if (tipo !== "MEV" && tipo !== "PESV") {
            document.getElementById("tipoMovil").value = "";
            document.getElementById("placa").value = "";
        }
    }


    // FOTOGRAFÍAS
    document.getElementById("fotos").addEventListener(
        "change",
        function(event) {

            archivosFotos =
                Array.from(event.target.files);

            const contenedor =
                document.getElementById("fotosPreview");

            contenedor.innerHTML = "";

            archivosFotos.forEach(function(archivo) {

                const imagen =
                    document.createElement("img");

                imagen.className = "foto";

                imagen.src =
                    URL.createObjectURL(archivo);

                contenedor.appendChild(imagen);

            });

        }
    );


    // OBTENER TIPOS DE HALLAZGO MEV
    function obtenerTiposHallazgo() {
        return Array.from(
            document.querySelectorAll('input[name="tipoHallazgo"]:checked')
        ).map(casilla => casilla.value);
    }


    // GUARDAR EN GOOGLE SHEETS
    function guardarEnGoogleSheets(
        fecha,
        ubicacion,
        contratista,
        tipoReporte,
        tipoMovil,
        placa,
        tiposReporte,
        observaciones,
        inspector
    ) {
        const datos = new URLSearchParams();

        datos.append("fecha", fecha);
        datos.append("ubicacion", ubicacion);
        datos.append("contratista", contratista);
        datos.append("tipoMev", tipoReporte);
        datos.append("tipoMovil", tipoMovil);
        datos.append("placa", placa);
        datos.append("tiposReporte", tiposReporte.join(", "));
        datos.append("observaciones", observaciones);
        datos.append("inspector", inspector);

        fetch(URL_GOOGLE_SHEETS, {
            method: "POST",
            mode: "no-cors",
            body: datos
        })
        .then(function() {
            console.log("Reporte enviado a Google Sheets.");
        })
        .catch(function(error) {
            console.error("Error al guardar el reporte:", error);
        });
    }


    // GENERAR REPORTE
    function generarReporte() {
        const fecha = document.getElementById("fecha").value;
        const ubicacion = document.getElementById("ubicacion").value.trim();
        const contratista = document.getElementById("contratista").value.trim();
        const tipoPrincipal = document.getElementById("tipoReportePrincipal").value;
        const tipoMovil = document.getElementById("tipoMovil").value.trim();
        const placa = document.getElementById("placa").value.trim();
        const tiposHallazgo = obtenerTiposHallazgo();
        const observaciones = document.getElementById("observaciones").value.trim();
        const inspector = document.getElementById("inspector").value;

        if (!ubicacion || !contratista || !tipoPrincipal || !observaciones || !inspector) {
            alert("Debe completar Fecha, Ubicación, Contratista, Tipo de reporte, Observaciones e Inspector.");
            return;
        }

        if ((tipoPrincipal === "MEV" || tipoPrincipal === "PESV") && !tipoMovil) {
            alert("Debe escribir el tipo de móvil.");
            return;
        }

        if ((tipoPrincipal === "MEV" || tipoPrincipal === "PESV") && !placa) {
            alert("Debe escribir el número de móvil o placa.");
            return;
        }

        if (tipoPrincipal === "MEV" && tiposHallazgo.length === 0) {
            alert("Debe seleccionar al menos un tipo de hallazgo para el reporte MEV.");
            return;
        }

        const cantidadFotos = archivosFotos.length;
        let reporte = `REPORTE DE INSPECCIÓN
Fecha: ${fecha}
Ubicación: ${ubicacion}
Contratista: ${contratista}
Tipo de reporte: ${tipoPrincipal}`;

        if (tipoPrincipal === "MEV" || tipoPrincipal === "PESV") {
            reporte += `\\nTipo de móvil: ${tipoMovil}`;
            reporte += `\\nNúmero de móvil o placa: ${placa}`;
        }

        if (tipoPrincipal === "MEV") {
            reporte += `\\nTipo de hallazgo: ${tiposHallazgo.join(", ")}`;
        }

        reporte += `

OBSERVACIONES:
${observaciones}

REGISTRO FOTOGRÁFICO:
${cantidadFotos} fotografía(s) adjunta(s)

INSPECTOR:
${inspector}`;

        document.getElementById("textoReporte").textContent = reporte;
        document.getElementById("resultado").style.display = "block";
        document.getElementById("resultado").scrollIntoView({ behavior: "smooth" });

        guardarEnGoogleSheets(
            fecha,
            ubicacion,
            contratista,
            tipoPrincipal,
            (tipoPrincipal === "MEV" || tipoPrincipal === "PESV") ? tipoMovil : "",
            (tipoPrincipal === "MEV" || tipoPrincipal === "PESV") ? placa : "",
            tipoPrincipal === "MEV" ? tiposHallazgo : [tipoPrincipal],
            observaciones,
            inspector
        );
    }


        // COMPARTIR POR WHATSAPP
    async function compartirWhatsApp() {

        const texto =
            document.getElementById(
                "textoReporte"
            ).textContent;


        if (navigator.share) {

            try {

                const datosCompartir = {
                    title: "Reporte de Inspección",
                    text: texto
                };


                if (
                    navigator.canShare &&
                    archivosFotos.length > 0
                ) {

                    datosCompartir.files =
                        archivosFotos;


                    if (
                        navigator.canShare(
                            datosCompartir
                        )
                    ) {

                        await navigator.share(
                            datosCompartir
                        );

                        return;

                    }

                }


                await navigator.share(
                    datosCompartir
                );

                return;

            } catch (error) {

                console.log(
                    "Compartir cancelado o no disponible."
                );

            }

        }


        const url =
            "https://wa.me/?text=" +
            encodeURIComponent(texto);


        window.open(
            url,
            "_blank"
        );

    }


    // LIMPIAR FORMULARIO
    function limpiarFormulario() {
        if (!confirm("¿Desea borrar toda la información del reporte?")) {
            return;
        }

        document.getElementById("ubicacion").value = "";
        document.getElementById("contratista").value = "";
        document.getElementById("tipoReportePrincipal").value = "";
        document.getElementById("tipoMovil").value = "";
        document.getElementById("placa").value = "";
        document.getElementById("observaciones").value = "";
        document.getElementById("fotos").value = "";
        document.getElementById("inspector").value = "";

        document.querySelectorAll('input[name="tipoHallazgo"]').forEach(casilla => {
            casilla.checked = false;
        });

        document.getElementById("grupoTipoMovil").style.display = "none";
        document.getElementById("grupoPlaca").style.display = "none";
        document.getElementById("grupoHallazgos").style.display = "none";

        archivosFotos = [];
        document.getElementById("fotosPreview").innerHTML = "";
        document.getElementById("resultado").style.display = "none";

        actualizarFecha();
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

</script>

</body>
</html>
